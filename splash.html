
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elm Street Guest Internet</title>
  <style>
    body {
      margin: 0;
      padding: 24px 12px;
      background: #eee;
      font: 14px Arial, Helvetica, sans-serif;
      color: #222;
    }
    .panel {
      margin: 25px auto;
      max-width: 480px;
      border: 1px solid #a7a7a7;
      background: white;
    }
    .heading {
      background: #e1e1e1;
      border-bottom: 1px solid #aaa;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: bold;
    }
    .content { padding: 18px; }
    h1 { font-size: 17px; margin: 0 0 15px; }
    p { line-height: 1.5; }
    .details {
      padding: 12px;
      border: 1px solid #ccc;
      background: #f7f7f7;
      margin: 18px 0;
      line-height: 1.8;
    }
    .button {
      display: inline-block;
      color: white;
      background: #266bb1;
      border: 1px solid #1a4f83;
      padding: 10px 26px;
      text-decoration: none;
      font: bold 14px Arial, sans-serif;
    }
    .footer {
      border-top: 1px solid #ddd;
      margin-top: 20px;
      padding-top: 12px;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="heading">Elm Street Guest Internet</div>
    <div class="content">
      <h1>Welcome to our wireless network</h1>
      <p>Internet access is available to guests. Click Continue below to connect.</p>

      <div class="details">
        <b>Network:</b> Elm Street Guest Wi-Fi<br>
        <b>Access:</b> Complimentary
      </div>

      <p><a class="button" href="$authtarget">Continue</a></p>

      <div class="footer">
        Elm Street Wireless Services &copy; 2026
      </div>
    </div>
  </div>
</body>
</html>
